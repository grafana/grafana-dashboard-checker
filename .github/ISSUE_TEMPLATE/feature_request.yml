name: Feature request
description: Suggest something the checker should do or report.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like the checker to handle it, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
