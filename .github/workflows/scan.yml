name: Scheduled scan

# Play's own deployment: runs the published image once against
# play.grafana.org, pushing results to Play's Cloud Loki instead of serving
# /metrics -- there's no cluster here to scrape it. See server.py's
# CHECKER_MODE=once / run_once(). To scan your own stack, see the README.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

# A manual run while the daily one is still going waits instead of overlapping.
concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    # One browser pass over every dashboard takes over an hour on one runner,
    # so each job scans a quarter of them (CHECKER_SHARD, by uid hash) and
    # pushes its own results. The shard count is also in CHECKER_SHARD below.
    name: scan (${{ matrix.shard }}/4)
    # Its secrets live in Grafana's Vault, so forks would only fail here.
    if: github.repository == 'grafana/play-dashboard-checker'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # Up to CHECKER_BROWSER_TIMEOUT_SECONDS (30m) of browser checks, plus image pull and Loki push.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Get Vault Secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
        with:
          # Secrets placed in the ci/repo/grafana/play-dashboard-checker path in Vault.
          # A dedicated access policy, scoped to logs:write only.
          repo_secrets: |
              LOKI_USERNAME=DASHBOARD_CHECKER_LOKI_USERNAME:DASHBOARD_CHECKER_LOKI_USERNAME
              LOKI_TOKEN=DASHBOARD_CHECKER_ACCESS_POLICY_TOKEN:DASHBOARD_CHECKER_ACCESS_POLICY_TOKEN

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Play and push results to Loki
        # Everything goes in through env and `-e NAME` (no value), so no
        # secret is pasted into the script or shows up in a process listing.
        env:
          CHECKER_MODE: once
          CHECKER_SHARD: ${{ matrix.shard }}/4
          CHECKER_BROWSER_TIMEOUT_SECONDS: "1800"
          CHECKER_BASE_URL: https://play.grafana.org
          # Play is public and its errors are what the dashboard is for.
          CHECKER_INCLUDE_ERROR_TEXT: "true"
          LOKI_URL: https://logs-prod-us-central1.grafana.net
          LOKI_USERNAME: ${{ fromJSON(steps.get-secrets.outputs.secrets).LOKI_USERNAME }}
          LOKI_TOKEN: ${{ fromJSON(steps.get-secrets.outputs.secrets).LOKI_TOKEN }}
          LOKI_JOB_LABEL: play-dashboard-checker
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          docker run --rm \
            -e CHECKER_MODE -e CHECKER_SHARD -e CHECKER_BROWSER_TIMEOUT_SECONDS \
            -e CHECKER_BASE_URL -e CHECKER_INCLUDE_ERROR_TEXT \
            -e LOKI_URL -e LOKI_USERNAME -e LOKI_TOKEN -e LOKI_JOB_LABEL \
            "$IMAGE"
