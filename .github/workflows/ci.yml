name: CI

on:
  push:
    branches: [main]
    # A version tag (v1.2.3) publishes a release image; see CONTRIBUTING.md.
    tags: ["v*"]
  pull_request:

# Jobs get only what they ask for below.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python3 -m unittest -v

  # ruff for the Python code, ESLint for dashboard_checker/browser/scan.js. Both versions are
  # pinned: requirements-dev.txt and package-lock.json.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No dependency cache: one is shared across runs, including the
          # release job's, so a poisoned cache could reach it. Installing 78
          # small packages takes seconds anyway.
          package-manager-cache: false
      # --ignore-scripts: nothing in the lockfile gets to run install scripts.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  # Pull requests: check the image still builds on both platforms. A job of its
  # own, with no packages: write, so code from a PR never runs with the right
  # to push images.
  build:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false

  # Pull requests: the real image, with a service account token, against a
  # throwaway Grafana (tests/smoke/token_smoke.py). Play's daily scan only
  # covers anonymous mode; this covers the token path and k6 base image bumps.
  # No secrets: the script makes its own Grafana, password and token.
  smoke:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -t dashboard-checker:smoke .
      - run: python3 tests/smoke/token_smoke.py --image dashboard-checker:smoke

  # main and version tags: build for both platforms and push.
  #   every build      -> :<full commit sha>  (what grafana-play pins)
  #   main             -> :main
  #   tag v1.2.3       -> :1.2.3, :1.2 and :latest
  # :latest only moves on a release, so it never points at unreleased code.
  publish:
    needs: [test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
