# Python lint settings. CI runs `ruff check .` with the version pinned in
# requirements-dev.txt; see CONTRIBUTING.md.
target-version = "py313"
line-length = 100

[lint]
# Listed explicitly rather than relying on ruff's defaults, which change
# between releases.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes: unused names, undefined names, ...
  "B",    # flake8-bugbear: likely bugs
  "UP",   # pyupgrade: syntax for the Python version above
  "I",    # import sorting
  "SIM",  # simplifications
  "RUF",  # ruff's own rules
]
